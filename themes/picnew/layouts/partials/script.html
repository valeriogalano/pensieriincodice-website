{{ $episode := .Page.Params.number | printf "PIC%d" }}
{{ $data := index hugo.Data.scripts $episode }}
<div class="accordion">
    <section id="show-text">
        <h2><a href="#show-text">Mostra testo dell'episodio</a></h2>
        <div>
            <a href="#">Nascondi</a>
            <div class="prose max-w-none mt-4">
                {{ with $data }}
                    <p class="text-sm text-pod-gray italic mb-6">Quello che segue è lo script originale dell'episodio.</p>
                    {{ replace .text "\n" "\n\n" | markdownify }}
                {{ end }}
            </div>
            <a href="#" class="inline-block mt-8">Nascondi</a>
        </div>
    </section>
</div>
<br/>
