1. La spesa in infrastrutture per addestramento e calcolo supererà nel 2026 i 2.500 miliardi di dollari, dei quali la maggior parte deriva dai costi per l'energia. Se i data center nel complesso fossero una nazione, il loro consumo stimato di 448 terawattora, cioè 448 miliardi di kilowattora, nel 2025 li collocherebbe all'undicesimo posto a livello mondiale, all'incirca alla pari con la Francia. Se li convertiamo in emissioni di CO2 equivalente, le IA impatterebbe sul clima tanto quanto le emissioni dell'intero Regno Unito nel 2025.

2. L'impatto sull'uso del suolo per l'infrastruttura informatica ed energetica potrebbe superare a fine decennio i 14 mila chilometri quadrati più o meno l'estensione dell'Irlanda del Nord. 3. Il consumo annuo dei data center è stimato in 9.300 miliardi di litri d'acqua, una quantità sufficiente a soddisfare il fabbisogno di acqua potabile degli 8,1 miliardi di abitanti della Terra per circa un anno e mezzo. È vero che si tratta di prelievo e non di consumo, perché viene reimmessa, ma una parte risulta comunque dispersa e soprattutto le falde e i sistemi fluviali accusano inevitabilmente il prelievo esasperato. 4. Secondo il report, il rapporto fra il costo ambientale di una ricerca tradizionale rispetto a una ricerca con le IA, media, è circa di 1 a 10.

5. Una risposta conversazionale consuma circa 200 volte più di una classificazione testuale. Generare un'immagine costa 60 volte più di una risposta testuale. Un breve video ad alta risoluzione può richiedere oltre 415 wattora, quanto 200 mila classificazioni di spam. E, da ultimo, la cosa forse meno nota, perché per mesi ci siamo sentiti dire che il training è impattante, ma poi la fase d'uso lo è sempre meno grazie all'efficienza dei modelli. Bene, dallo studio emerge che l'inferenza cuba da sola fra l'ottanta e il 90% per cento del consumo complessivo dell'AI.

Ovviamente sono numeri che presentano tutte le limitazioni che abbiamo menzionato per tutto questo tempo e sono riferiti ai dati 2025, quindi in futuro sicuramente cambieranno. Per questo non ha senso fissarsi un numero o dei numeri in testa, però ha senso, secondo me, pensare agli ordini di grandezza e anche all'impatto relativo di una cosa rispetto all'altra.

