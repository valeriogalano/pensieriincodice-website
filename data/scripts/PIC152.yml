## Introduzione

Hai mai pensato a quanto inquina uno scambio di battute fatto con un chatbot o un prompt fatto eseguire ad un agente?

Se la domanda ti ha mai sfiorato, probabilmente hai anche trovato qualche risposta, perché in rete ne girano parecchie, con tanto di grammi di CO2 o cucchiaini di H2O consumata.

Beh, la voce che ascolterai oggi è partita proprio da quella domanda e, dopo più di un anno passato tra report, analisi e articoli, è oggi qui con noi a darci una vera risposta. E spoiler: in stile Pensieri in codice, sarà una risposta scomoda.

Paola fa parte da anni della community di questo podcast, di mestiere è consulente in ambito sostenibilità e in questo episodio della serie Community Edition non ci darà semplicemente il classico numero da ripetere alla prima occasione.

Ti avviso: si tratta di un episodio più lungo del solito e piuttosto denso, perché di sigle e di acronimi ne incontreremo parecchi. Quindi, in descrizione trovi, tra le varie fonti citate, anche un mini glossario che potrà esserti utile.

Io però non voglio anticipare altro, quindi lascio la parola a Paola e noi ci risentiamo per la conclusione.

Buon ascolto!

## La domanda giusta da porsi

Buongiorno a tutti, premetto che è più di un anno e mezzo che ho promesso a Valerio di preparare una puntata di pensieri in codice Community Edition.

Credo che il tutto sia nato da qualche mio intervento spot nel canale Telegram, cui ha fatto seguito un inoltro da parte mia di un'imponente mole di articoli, fonti, presentazioni, KPI sparsi, che io avevo raccolto e lo faccio tuttora per capire in modo serio quanto costa l'ambiente l'intelligenza artificiale. Valerio li ha ricevuti tutti e mi ha più o meno detto tutto bene, tutto bello, ma perché non ne parli tu anziché io? E quindi eccoci qui, con calma, dopo un anno e mezzo, forse anche di più.

Per chiunque non abbia vissuto in un armadio negli ultimi tre o quattro anni, a prescindere da quanto usi l'AI nella vita quotidiana e da quanto creda nel cambiamento climatico nel concetto di sostenibilità ambientale, il tema dell'impatto ambientale dell'AI è qualcosa di cui ha quantomeno sentito parlare. E il motivo per cui ho accettato volentieri di contribuire a pensieri in codice, e ringrazio Valerio per l'opportunità, è che questa tematica mi accende perché riguarda sia me come persona particolarmente sensibile al tema della sostenibilità ambientale e sociale, e da qui deriva l'entusiasmo, sia me come professionista, perché il mio lavoro è quello di consulente in ambito sostenibilità, e da qui deriva la competenza.

La me di un anno e mezzo fa aveva un obiettivo molto ambizioso dare numeri certi e argomentare come ci eravamo arrivati quante tonnellate di CO2 equivalente emette un'interazione con le AI quante in termini assoluti quanto un modello rispetto ad un altro e quindi ero lì che aspettavo l'ultimo report l'ultima analisi, l'ultimo paper, leggevo tutti gli articoli il problema è che mi sono resa conto che per queste domande potrebbe non esistere una risposta scientificamente affidabile così abbiamo concordato di provare ad abbassare un pochino l'asticella e ragionare in modo diverso anziché provare a dare un risultato o un'idea così stimata da perdere senso nella discussione proviamo a creare una sorta di cassetta degli attrezzi costruendo un linguaggio che oggi ci aiuta a ragionare partendo dall'AI ma che in realtà diventa applicabile a diversi altri ambiti del nostro quotidiano che è comunque un obiettivo ambizioso ma forse più utile sostanzialmente si tratta di leggere termini come carbon footprint o impatto sul cambiamento climatico o prodotto ecologico e capire da un lato che tipo di dati ci siano sotto dall'altro quanto sia attendibile quello che stiamo leggendo considerando che secondo il mio modesto parere le aziende sono ancora immerse nel pieno della comunicazione ambientale ingannevole spero di potervi regalare qualche briciolina di competenze in più per capire cos'è reale e cos'è fuffa Tornando alle origini di questa puntata sono partita da quanto inquina lei hai numeri assoluti e benchmark e sono arrivata a come si misura l'impatto ambientale di qualcosa e perché è così difficile stimare il reale impatto dell'AI sull'ambiente devo fare tre premesse importanti la prima è che parlerò di ei per semplificare ma tendenzialmente mi riferirò all'intelligenza artificiale generativa in qualsiasi declinazione perché è la sua diffusione su larga scala ad avere un impatto concreto e riscontrabile sulla tematica secondariamente voglio precisare che qualsiasi cosa dirò non vuole essere un giudizio o un attacco all'intelligenza artificiale in senso lato né includerò nel mio racconto gli impatti altri di questa tecnologia copyright, diritti umani, impatti sociali, privacy eccetera eccetera io proverò solo a spiegare qualche come, qualche quanto e qualche perché sugli impatti ambientali che inevitabilmente si porta dietro da ultimo devo fare un disclaimer relativo agli acronimi che inevitabilmente userò li devo usare tutti, cercherò di spiegarli anche più volte ma è possibile che comunque vi perderete come con i nomi del Silmarillion o nelle descrizioni della famiglia Buendia in cent'anni di solitudine quindi prendendo spunto dai maestri se Valerio è d'accordo magari vi lascio un mini glossario per non perdere il filo

## Cosa si intende per impatto ambientale (dell'AI)

Partiamo da un concetto relativamente facile cambiamento climatico versus inquinamento quando parliamo di cambiamento climatico facciamo riferimento alle conseguenze sul clima delle emissioni di gas serra che vengono normalmente espresse attraverso la cosiddetta carbon footprint o impronta carbonica misurata appunto in quantità di anidride carbonica equivalente o CO2 e emessa in atmosfera c'è una misura che tiene conto di tutti i gas serra convertendoli in un'unica unità quando invece parliamo di inquinamento ci riferiamo alla presenza di sostanze o agenti che danneggiano l'ambiente o la salute umana e possono impattare su aria acqua suolo e poi indirettamente sull'uomo qui rientrano le sostanze tossiche cancerogene e pericolose in genere poi ci sono altre tematiche importanti che possiamo includere in quelle legate a impatti ambientali la biodiversità l'acqua il consumo di risorse e consideriamo che alla fine tutti questi temi sono o possono essere interconnessi però i due che per la mia esperienza causano più confusione sono indubbiamente inquinamento e cambiamento climatico da qui la rapidissima incursione come accennato nel cosiddetto impatto ambientale di qualcosa rientrano entrambi questi aspetti ma attualmente come credo tutti abbiate percepite in maniera più o meno consapevole la tematica sicuramente più sentita e più urgente è quella relativa al cambiamento climatico non posso addentrarmi ma butto lì giusto due concetti che potete cercare online accordi di Parigi SDGs o sustainable development goals che sono quei 17 pittogrammi colorati che potremmo definire il prezzemolo del marketing dell'ultimo decennio obiettivo net zero al 2050 e il concetto di mantenere l'aumento delle temperature al di sotto di 1,5 gradi entro fine secolo rispetto all'era preindustriale spoiler non ci riusciremo

Tutti questi concetti nei quali non mi addentro ora per ovvie ragioni sono quelli che definiscono il quadro globale nel quale poi si incastrano alcune decisioni che hanno ripercussioni anche pratiche sul nostro quotidiano gli incentivi su alcune cose la messa al bando di altre le tasse sulle importazioni da determinati paesi gli aumenti delle bollette eccetera eccetera lasciamo tutto fuori e teniamoci stretto quindi il concetto che inquinamento e cambiamento climatico sono due cose correlate ma non sinonimi e aggiungiamoci che l'AI impatta su entrambi e anche su altri di quelli che ho citato ma lo vediamo dopo in modo diverso mentre sull'inquinamento il suo contributo è meno noto anche se rilevante sul cambiamento climatico è un contributo importante e soprattutto che sta crescendo in modo vertiginoso Ma come facciamo a dire che qualcosa contribuisce al cambiamento climatico e su che basi affermo che lei è un player importante?

La risposta è misurando le emissioni dei cosiddetti GHG, greenhouse gases, cioè i gas serra. Non esiste solo l'anidride carbonica, esistono anche altri gas come il metano, il protossido di azoto, alcuni gas fluorurati, eccetera, e ognuno di questi scalda l'atmosfera in modo diverso. Per poter confrontare le mele con le pere, entra in gioco il concetto di gvp cioè Global Warming Potential, o potenziale di riscaldamento globale. Il gvp è, semplificando molto, un fattore di conversione che ci dice a quante tonnellate di CO2 equivale una tonnellata di questo gas in termini di effetto sul clima? Così possiamo trasformare tutti i nostri gas serra in un'unica unità di misura, che è la CO2 equivalente o CO2e.

Quindi quando leggete che un prodotto, un'azienda o anche un modello di intelligenza artificiale emette 100 chili di CO2, non significa che abbia emesso solo anidride carbonica. Significa che tutte le emissioni di gas serra sono state convertite nell'effetto climatico equivalente a 100 chili di CO2. Infatti ci sono gas che hanno un impatto molto ma molto maggiore della ben più famosa anidride carbonica, il gas metano ad esempio, ma soprattutto alcuni gas refrigeranti come quelli usati nei condizionatori. E parliamo di un gvp che può variare enormemente da gas a gas. Alcuni gas refrigeranti ad esempio hanno un gvp anche mille volte superiore a quello della CO2.

Una volta trovata quindi questa metrica, che consente misurazioni e comparazioni, la domanda successiva è cosa stiamo misurando esattamente? Perché se l'affermazione emette 100 chili di CO2 equivalente è riferita a un prodotto o a un'azienda, c'è qualcosa di tangibile. Come un prodotto costa tot da un punto di vista economico, costa un tot altro anche dal punto di vista ambientale. E questo fila. Ma come facciamo a misurare l'impatto dell'AI in senso lato? È un po' come chiedersi quanto impattano i trasporti? Quali? Quando? Perché distanza? Per quanto tempo?

Per chiarire questo punto torniamo quindi un attimo indietro all'azienda al prodotto. Con una serie di doverose premesse e necessarie stime, noi possiamo misurare le emissioni di un'organizzazione, di un prodotto, di una fase del ciclo vita oppure dell'intero ciclo di vita. Ed è qui che tiro fuori dal cappello come formule magiche acronimi come CFO, CFP, LCA ed EPD.

## L'impatto dell'azienda nel suo complesso: la Carbon Footprint di Organizzazione

Partiamo quindi da cos'è una carbon footprint o impronta carbonica di organizzazione, CFO, e di prodotto, CFP. Controintuitivamente vedremo poi che nel caso dell'AI i dati più reperibili, anche se potremmo aprire una parentesi sia sul concetto di dati sia sull'aggettivo reperibili, sono quelli relativi alle carbon footprint di organizzazione. Immaginiamo una carbon footprint come un numero, appunto espresso in tonnellate di CO2 equivalente, che è il risultato di una serie di calcoli conditi con una buona dose di inevitabili stime. Parlando di organizzazione ci riferiamo a un'azienda nel suo complesso, quindi stiamo cercando di capire quanto un'azienda contribuisce al cambiamento climatico misurando il numero di tonnellate di anidride carbonica equivalente che butta o che fa buttare a qualcun altro, ma restano legate alla sua attività, in atmosfera. In un dato periodo di tempo che tipicamente, anche se non sempre, è un anno solare. Se il concetto di perimetro temporale è piuttosto facile da comprendere, ad esempio appunto un anno solare, l'espressione un'azienda nel suo complesso è molto più complicata. E ci vengono in aiuto due standard molto usati, che hanno dei punti in comune e delle divergenze, e che complicano non poco il quadro quando vogliamo comparare due aziende che hanno calcolato la propria impronta utilizzando l'uno o l'altro. Il protocollo GHG e la norma ISO 14064.

Non entriamo nei dettagli, ci basti sapere che questi due standard ci dicono come arrivare a questo risultato numerico che, secondo entrambi, è la somma di una serie di pezzettini di contributo. Il ragionamento di base per qualsiasi pezzettino sotto è ho un dato attività che può essere espresso in qualsiasi unità di misura, possono essere chili di qualcosa, pezzi di qualcos'altro, kilowattora di energia consumata, standard metri cubi di gas, metri cubi di acqua, eccetera, e lo devo moltiplicare per un fattore di emissione. Tendenzialmente in mezzo c'è qualche conversione, sempre per il discorso delle mere delle pere. Non ci addentriamo in tecnicismi, limitiamoci a un esempio basico. Prendo i litri di benzina consumati, eventualmente convertiti in un'unità di misura coerente con il fattore di emissione che ho, li moltiplico per il mio fattore di emissione e ottengo le tonnellate di CO2 equivalenti corrispondenti ai litri di benzina consumati. Questo lo potrei fare anche io cittadino per calcolare ad esempio l'impatto in termini di tonnellate di CO2 del viaggio tal dei tali, ed è l'informazione alla base dei ragionamenti sui claim di marketing delle agenzie di noleggio, delle specifiche delle auto, delle compagnie aeree, eccetera.

Il fattore di emissione deriva in alcuni pochi casi da calcoli o misurazione diretta, e lo vediamo dopo, ma la maggior parte delle volte sono stime provenienti da letteratura. Esistono database, molti sono proprietari, che contengono migliaia di fattori di emissione per le cose più disparate e ciascuno di questi ha o dovrebbe avere una scheda tecnica che spiega nel dettaglio come è stato calcolato, quando, che stime sottintende e le eventuali limitazioni correlate.

Sui fattori di emissione attenzione a tre cose. uno I fattori di emissione possono, e tendenzialmente succede, variare in base alla zona geografica. Quindi, ad esempio, il fattore di emissione associato a un kilowattora di energia elettrica in Spagna, in Francia, in Italia o in India non è uguale, ma variano anche nel tempo, non solo nello spazio. due Esistono alcuni database pubblici riconosciuti sui fattori di emissione più noti, ad esempio quelli legati al consumo di energia, di vettori energetici, ma la maggior parte sono privati e costosi e per nulla banali da consultare, ed è per questo che esistono aziende come quella nella quale lavoro io che fanno questo tipo di calcoli, perché la scelta del fattore di emissione è determinante per l'accuratezza del risultato. tre Spesso esistono fattori di emissione diversi, tutti ugualmente riconosciuti, per la stessa attività. Questo provoca un risultato potenzialmente molto diverso partendo dallo stesso dato attività.

Magari il fattore di emissione non si discosta tantissimo, ma il dato attività che viene moltiplicato è molto grande e quindi il delta sul risultato finale è altrettanto ampio. E sapere questo concetto è particolarmente rilevante quando si fanno delle comparazioni. Tornando quindi agli standard a cui possiamo far riferimento, partiamo dal protocollo GHG perché almeno come termini è il più diffuso. Il protocollo GHG divide le emissioni in tre grandi contenitori, lo scope 1, lo scope 2 e lo scope 3. Lo scope 1 include le emissioni dirette, quindi tutte le emissioni prodotte direttamente dall'azienda, il consumo di gas metano, tutti i carburanti, le emissioni di processo per alcune aziende e le perdite dei famosi gas refrigeranti che hanno, come ho detto prima, un impatto altissimo. Infatti siccome anche pochi chili di perdite di questi gas possono corrispondere a tonnellate di CO2 equivalente, devono per legge essere monitorati a cadenze specifiche.

Lo scope 2 include delle emissioni indirette legate all'energia importata. L'esempio più facile è il prelievo da rete di energia elettrica. Il concetto è non emetto direttamente io, azienda, ma qualcuno da qualche parte ha emesso per produrre l'energia elettrica che io sto consumando, quindi rientra nella mia impronta carbonica. E fin qui siamo alla parte facile. Poi, come la cavalleria,

arriva lo scope 3 quando ho definito il concetto di carbon footprint di organizzazione ho detto che l'azienda dovrebbe includere le emissioni che butta in atmosfera ma anche quelle che fa buttare a qualcun altro ma restano legate alla sua attività questa è una rappresentazione abbastanza accurata di cosa si intende per scope 3 secondo il protocollo GHG la ISO 14064 anziché usare il concetto di scope usa le categorie la 1 e la 2 sono assimilabili agli scope 1 e 2 mentre sostanzialmente le categorie le categorie dalla 3 alla della ISO 14064 sono il parallelo dello scope 3 nel complesso lo scope 3 comprende quindi tutte quelle emissioni indirette che avvengono lungo la catena del valore dell'azienda quindi sia a monte sia a valle del suo perimetro fisico non sono quindi le emissioni dirette dell'azienda né quelle legate all'energia che acquista che abbiamo visto essere lo scope 2 ma tutto quello che succede prima e dopo include la produzione dei beni che acquista i fornitori, i trasporti da e verso fornitori clienti lo spostamento casa lavoro dei suoi dipendenti la cosiddetta fase upstream dell'energia quindi quello che succede nella filiera per arrivare a produrre il famoso kilowattora consumato lo smaltimento il trasporto dei rifiuti aziendali fino al trasporto dei propri prodotti verso il distributore il consumatore il loro uso e la gestione del loro fine vita Ed è qui che il quadro diventa molto più complesso perché non stiamo più misurando solo quello che controlliamo direttamente ma tutto ciò che è collegato alla nostra attività di azienda.

Una delle cose che mi ha colpito quando ho cominciato a occuparmi di queste tematiche è trovare un fattore di emissione specifico per cose come il pernottamento in hotel nel dato paese o per i pasti mensa di un'azienda ma ovviamente si devono includere anche cose di cui è più facile capire l'impatto come la produzione delle materie prime o degli imballi o ancora stime complicate come le tonnellate di CO2 associate all'acquisto di infrastrutture e asset.

Significherebbe anche e uso il condizionale per una ragione che se ad esempio faccio fare una lavorazione un fornitore dovrei raccogliere il dato sui suoi consumi diretti indiretti ma solo per la porzione che ha usato per lavorare il mio prodotto. Se poi ci spostiamo su quello che avviene dopo che il prodotto è uscito dalla mia azienda dovrei calcolare anche l'impatto emissivo legato all'uso del mio prodotto se ne ha uno. Ad esempio se vendo macchinette del caffè dovrei stimare quanta CO2 emette ciascuna di queste nella sua fase d'uso presso l'utente nonché le emissioni legate al suo smaltimento a fine vita.

E c'è un'ultima complicazione che vale la pena conoscere. Anche sotto numeri apparentemente appartenenti allo stesso perimetro, quindi comparabili, possono esserci storie molto diverse. Prendiamo lo scope 2, cioè l'energia acquistata, tipicamente, come dicevo, elettrica. Le emissioni possono essere calcolate con due approcci diversi. Location-based considera un mix elettrico reale della rete da cui l'energia viene prelevata. Market-based, invece, tiene conto dei contratti di acquisto dell'energia e di strumenti come le garanzie d'origine, cioè i certificati che attestano l'acquisto di energia rinnovabile.

Entrambi gli approcci sono previsti dagli standard, ma i risultati possono essere molto diversi. Quindi un'azienda può mostrarci emissioni scope 2 molto basse, pur continuando a prelevare energia dalla stessa rete elettrica dell'anno precedente, semplicemente perché ha acquistato garanzie d'origine. Però possiamo intuitivamente capire che avere uno strumento contrattuale che attesta che la mia quota di energia prelevata dal distributore è stata scambiata con pari quota prodotta da qualche altra parte con energia rinnovabile, e prelevare meno energia da rete perché, ad esempio, ho un impianto fotovoltaico mio, non sono la stessa cosa. E lo stesso vale, su un piano diverso, per i crediti di carbonio. Probabilmente avrete sentito parlare di progetti di riforestazione associati o meno alla vendita di crediti di carbonio. Ma anche qui, compensare una parte delle proprie emissioni finanziando progetti di riforestazione o altri interventi climatici altrove, non significa avere messo meno. Significa aver scelto di compensare, almeno in teoria, una parte di quell'impatto.

È una distinzione importante, perché ridurre e compensare non sono la stessa cosa. Facciamo un parallelismo. Ridurre significa non peccare più. Compensare significa continuare a peccare, ma comprarsi le indulgenze per apparire senza macchia. E va benissimo per la quota di emissioni che non riesco più a ridurre? Non va bene se lo uso come scusa per lavarmi la coscienza.

Penso sia intuibile che mentre per quello che l'azienda controlla direttamente abbiamo un'attendibilità di un certo tipo più ci allontaniamo dal controllo diretto da parte dell'azienda più dobbiamo appoggiarci a stime fino a un certo punto a fare un cosiddetto cut off ed escludere alcuni di questi mattoncini perché diventano così aleatori da diventare non significativi penso che a qualcuno possa già essersi attivato qualche link pensando all'AI e in almeno due direzioni da un lato c'è un tema di azienda standard prendiamo un'azienda che fa software o che fa grafica o che fa comunicazione come fa a includere l'impatto dell'AI che è indubbiamente legato alla propria attività nella propria carbon footprint di organizzazione dall'altro c'è l'azienda proprietaria di modelli di ai come fa a includere la fase d'uso da parte degli utenti nella sua quindi in questa prima parte abbiamo definito spero cosa è una misurazione dell'impatto ambientale e abbiamo capito spero che non possiamo parlare seriamente dell'impatto dell'AI se prima non costruiamo un linguaggio comune e non definiamo l'oggetto della misura nella prossima parte proviamo a capire come interpretare quella misura

## Cosa ce ne facciamo della CFO

Partiamo quindi dal numeretto che vediamo ad esempio sul sito di un'azienda o sul report di sostenibilità di Microsoft o di Google, per citarne un paio. Su cosa sia un report o bilancio di sostenibilità torno più avanti, ma a prescindere da dove si trovi questo dato relativo all'impronta carbonica, tutta la spiegazione fatta prima ci serve per capire come interpretare quel famoso numero. Se io leggo che un'azienda ha calcolato la sua carbon footprint di organizzazione e vedo un numeretto o un numerone, nel caso dell'azienda che ho citato, si pongono due temi. Il primo è che non abbiamo un'idea di quanto sia grande o piccolo quel numero in termini di benchmark.

2000 tonnellate? 20.000? 100.000? un milione Che arriviamo a cifre che fanno girare la testa o meno? Non sappiamo se quel numero sia tanto, sia poco, se l'azienda sia virtuosa o meno. Ma diamo questi numeri così cominciamo a metterli sul piatto. Microsoft dichiara circa 20 milioni di tonnellate di CO2 equivalente per il fiscal year 2025. Google circa 15 milioni. Io consumatore medio leggo i due report. Scherzo, nessun consumatore medio leggerebbe i due report. Mettiamo che legga un articolo che riporta i due numeri estratti dai report e mi dico che quindi Microsoft è peggio di Google. E questa è esattamente la trappola del numero assoluto.

Perché prima dovremmo sapere cosa stiamo confrontando. Stesso perimetro? Stessa metodologia? Stessa definizione di scope 3? Stessa dimensione delle aziende? Stesso modello di business? No. Non necessariamente quindi Microsoft è peggio di Google. Un numero assoluto ci dice poco, ma anche un trend sui numeri assoluti ci dice poco. Un'azienda potrebbe aver emesso il 10% per cento in più dell'anno precedente, ma aver prodotto e venduto cento volte tanto. Quindi in realtà il suo indice emissivo o indice di intensità emissiva è migliorato. Un indice emissivo è espresso come rapporto fra le tonnellate di CO2 emessa e un dato che per l'azienda è significativo, come le tonnellate di prodotto venduto, il fatturato, il numero di dipendenti medi. E questo numero, per ragioni diverse, può variare nel tempo. Se cala, tendenzialmente sono migliorato. Va approfondito il perché, ma in senso assoluto è un buon segno. Se cresce, tendenzialmente red flag. Anche in questo caso con una serie di però, però indicativamente non è un buon segno.

Il tema forse più rilevante è però legato al famoso concetto di perimetro considerato. Ad esempio, spesso in piccolissimo vicino al numeretto c'è una nota tipo limitata allo scope 1 e 2. Ecco, questa nota ci sta dicendo che l'azienda ha calcolato sì la sua impronta carbonica, ma coprendo, faccio una stima che vale per diversi settori in ambito produttivo, non per l'azienda di servizi, all'incirca il 10 15 per cento del suo impatto reale. Sostanzialmente, lo scope 3 o le categorie 3 6 della ISO 14064 per molte aziende rappresenta la quota preponderante, arrivando spesso al 70 80 per cento e in alcuni casi anche oltre del complesso delle tonnellate di anidride carbonica emesse. Quindi, mostrarci solo il pezzettino delle emissioni legate al consumo di energia e magari dirci che le emissioni di CO2 sono diminuite del 30% per cento perché è stato installato un impianto fotovoltaico, equivale a farci vedere solo la punta dell'iceberg. Non è intrinsecamente sbagliato o esecrabile. Un'azienda che calcola la sua CFO, anche se è limitata agli scope 1 e 2, fa comunque qualcosa di buono e spesso lo fa volontariamente. Però per noi che vediamo quel numero, la distinzione è rilevante.

Ma anche un'azienda che include lo scope 3 potrebbe fare delle esclusioni metodologiche significative. Se torniamo all'esempio che ho fatto prima, oggi praticamente tutte le aziende a livelli diversi hanno implementato strumenti di AI generativa nei propri processi. Ma difficilmente, per le stesse ragioni per cui è un anno e mezzo che devo registrare questa puntata, e cioè che anche volendo non ci sono dati, includono l'impatto dell'AI legato all'utilizzo dei servizi sottostanti, dai data center all'infrastruttura necessaria per farli funzionare.

## L'impatto del prodotto: la Carbon Footprint di Prodotto e gli studi LCA

Come anticipavo, parlando di AI, per ora la CFO, cioè la carbon footprint di organizzazione, risulta un dato, virgolette, più reperibile, virgolette, rispetto a una CFP, che invece è una carbon footprint di prodotto. Calcolare una CFP significa calcolare l'impronta carbonica di un singolo prodotto o di una categoria di prodotti. Prendiamo un esempio facile. Un chilo di ottone prodotto da una specifica fonderia attraverso estrusione. Sostanzialmente si identifica una misura di riferimento definita unità funzionale di prodotto, si verifica se esiste una Product Category Rule, o PCR, che è una guida metodologica per la specifica categoria di prodotto, e si esegue un'analisi chiamata LCA o LCA, acronimo di Life Cycle Assessment, cioè una valutazione dell'intero ciclo di vita del prodotto.

Ho detto intero ciclo vita anche se anche in questo caso si possono fare delle scelte e dichiararle entrano quindi in gioco concetti come from cradle to grave dalla culla intesa come estrazione delle materie prime alla tomba quindi smaltimento a fine vita from cradle to gate dalla culla al cancello inteso come confine aziendale o from cradle to cradle quando il prodotto è progettato per rientrare in un nuovo ciclo ad esempio attraverso recupero o riutilizzo delle sue componenti attraverso lo studio LCA nel quale non posso tuffarmi sappiate solo che è molto bello molto complesso e tendenzialmente richiede software specifici per essere modellizzato si ottiene l'impatto emissivo in termini di tonnellate o chili o grammi di anidride carbonica equivalente per unità funzionale di prodotto insieme a un'altra corposa serie di dati legati a impatti su altri aspetti ambientali se torniamo all'esempio del chilo di barra di ottone significa calcolare quante emissioni di CO2 equivalente genera quel chilo di di quella specifica azienda con quella composizione e con quello specifico processo produttivo

potete immaginare che per arrivare a questo numero si debbano fare comunque molte assunzioni molte stime molti calcoli e che il numero in sé andrebbe sempre letto soprattutto se su quel numero vogliamo fare delle valutazioni specifiche insieme al dettaglio di tutti questi fattori perché è chiaro che una scelta da consumatore da azienda da stakeholder in genere basata su un'informazione metodologicamente non adeguata le mie esigenze è una scelta potenzialmente cieca Una precisazione rilevante perché abbiamo parzialmente switchato dal cambiamento climatico agli impatti ambientali in senso lato e la distinzione è importante.

Abbiamo detto che la CFO misura l'impatto emissivo di un'organizzazione mentre la CFP misura l'impatto emissivo di un prodotto. Per fare una CFO seguo uno degli standard che abbiamo menzionato prima, quindi il protocollo GHG o la ISO 14064. Per fare una CFP invece seguo la ISO 14067 che a sua volta si basa sui principi della famiglia di norme ISO 14040 relativa agli studi LCA.

L'LCA essendo uno studio del ciclo vita non valuta solo gli impatti ambientali associati alle emissioni di CO2, quindi non valuta soltanto le emissioni di CO2 in senso stretto, ma anche altri possibili effetti sull'ambiente. Ad esempio misura il consumo di risorse, l'uso di acqua e suolo, il potenziale di eutrofizzazione, l'acidificazione, l'esaurimento di alcune risorse, la tossicità per l'uomo, per gli ecosistemi eccetera. Queste sono categorie diverse che rispondono chiaramente a domande diverse. Quindi un prodotto può avere un impatto emissivo in termini di CO2 relativamente basso, ma avere un impatto significativo sul consumo di acqua sull'utilizzo di determinate materie prime o viceversa. Quindi avere un impatto emissivo molto alto, ma non impattare sugli altri aspetti ambientali. In ogni caso limitarsi, se si guarda all'impatto ambientale di un di un prodotto in senso lato, limitarsi alla sola CO2 equivalente racconta una parte della storia e non tutta. I risultati di uno studio essay possono poi infatti confluire, oltre che in una carbon footprint di prodotto che analizza solo il pezzettino di tonnellate di CO2, possono invece confluire in una EPD, Environmental Product Declaration, cioè una dichiarazione ambientale di prodotto.

Semplificando molto, l'EPD è come una sorta di carta di identità ambientale, cioè un documento che comunica gli impatti ambientali tutti calcolati secondo una metodologia definita e verificata da un ente terzo riconosciuto. Non è un bollino che dice questo prodotto è sostenibile o questo prodotto ecologico, ed è una distinzione fondamentale, quindi non dà un giudizio ma mette a disposizione dati confrontabili sugli impatti di quel prodotto lungo il suo ciclo vita.

