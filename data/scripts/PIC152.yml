## Torniamo all'AI: le variabili in gioco

Se ripercorriamo la puntata dall'inizio fino a qui, siamo partiti dal concetto molto ampio di impatto ambientale di cosa sia una misura in quell'ambito, per poi tuffarci nelle metodologie specifiche, sapere come quella misura viene generata e soprattutto conoscerne i limiti e le reali possibilità di confronto. Di base, la domanda da cui siamo partiti è quanto impatta davvero l'AI sull'ambiente. Il fatto è che quando parliamo di impatto ambientale dell'AI non stiamo parlando semplicemente di un prodotto fisico con una filiera facilmente delimitabile, ma di un ecosistema molto più complesso dove dobbiamo capire quali confini scegliere, quali dati abbiamo a disposizione e quali impatti vogliamo davvero misurare.

Attualmente parlare di un LCA, un EPD o una CFP completa e comparabile riferita all'AI ai è di fatto impraticabile. Intanto c'è un problema legato all'unità di riferimento. Per un prodotto fisico è abbastanza naturale, un chilo di ottone, una bottiglia, un'automobile. Nell'AI invece qual è l'unità funzionale? Una richiesta? Un token? Una conversazione? Un'immagine generata? Un'ora di utilizzo? Ognuna di queste scelte porta risultati diversi e nessuna oggi è universalmente riconosciuta come la più corretta.

Prima ancora di discutere dei numeri, quindi, manca un accordo su che cosa rappresenti davvero un'unità di AI. Ma pur scegliendo un'unità di riferimento i problemi non finiscono. Dovremmo sapere quale modello stiamo utilizzando, su quale infrastruttura gira, con quale hardware, in quale data center, alimentato da quale mix energetico, con quale livello di utilizzo di efficienza e quasi tutte queste informazioni semplicemente non sono pubbliche. E anche se lo fossero rimarrebbe la fondamentale domanda sul perimetro. Quali confini scegliamo? Vogliamo misurare solo la fase d'uso o consideriamo anche l'addestramento?

E la costruzione dei data center dove la mettiamo? La produzione dei chip, il trasporto, la manutenzione, il fine vita? Cioè tutto quello che abbiamo visto parlando di LCA, ma portato all'estremo. Quindi dopo tutto questo tempo mi aspetto che chiunque di voi legga qualcosa come una singola richiesta, un LLM, emette X ram di CO2 o peggio ancora emette come una lampadina da 80 watt lasciata accesa per un'ora, vada a cercare da qualche parte informazioni come la metodologia di calcolo, la base dati, le assunzioni, il perimetro. O quantomeno sia consapevole che è un'informazione così parziale da essere quasi inutile.

Le variabili in gioco quindi sono quelle che abbiamo menzionato, il tipo di modello e il task che gli stiamo chiedendo, la sua dimensione, cioè il numero di parametri, il tipo di output richiesto, il data center specifico in cui la richiesta viene processata, il momento della giornata, la rete elettrica locale a cui quel centro è connesso, la fonte energetica prevalente in quel momento. Siccome la maggior parte dei modelli oggi in uso sono modelli chiusi e le aziende che li producono non rivelano il numero di parametri, non dichiarano l'hardware utilizzato, non comunicano l'ubicazione dei data center e non forniscono dati puntuali sull'energia, fondamentalmente non ci sono dati attendibili neanche per fare stime.

## Quindi, questi dati

Però dopo ormai quasi quattro anni dal lancio del primo ChatGPT possiamo comunque affermare qualcosa con ragionevole grado di affidabilità. Anche se non siamo ancora in grado di attribuire con precisione assoluta ogni kilowattora o ogni tonnellata di CO2 alle IA generativa, la direzione è chiara. La diffusione degli LLM ha determinato una crescita molto significativa dei consumi energetici dei grandi operatori cloud e, di conseguenza, delle loro emissioni.

I data center progettati per l'intelligenza artificiale hanno infatti caratteristiche molto diverse rispetto ai data center tradizionali, richiedono enorme quantità di GPU, assorbono molta più potenza elettrica e pongono anche sfide maggiori dal punto di vista del raffreddamento. e Il risultato è che proprio negli anni in cui l'ei generativa esplosa, aziende come Microsoft e Google hanno visto interrompersi o addirittura invertirsi il percorso di riduzione delle emissioni che avevano intrapreso per raggiungere i propri obiettivi climatici. E questa informazione non ce la dicono gli haters, le associazioni di consumatori o le ONG tipo Greenpeace ce la dicono direttamente le aziende attraverso il loro report di sostenibilità

