## Non solo cambiamento climatico

omesso.

E non ci sono solo le emissioni di CO2 da considerare come avevo detto all'inizio del nostro viaggio sugli impatti ambientali ci sono anche altri impatti che vanno considerati sempre nei report di sostenibilità troviamo anche indicazioni ad esempio sul consumo di acqua che come penso sappiate è un altro tema scottante e non uso il termine a caso quando si parla di AI i data center infatti usano enormi quantità di acqua spesso potabile principalmente per il raffreddamento considerate che sempre da dati resi disponibili dalle aziende l'ascesa dell'AI generativa ha già portato a un aumento del consumo idrico del 20 per cento per Google e del 34 per cento per Microsoft il consumo di acqua per singola risposta esattamente come per l'aspetto emissivo non è facilmente stimabile però calcolate che da pochi millilitri si può arrivare anche fino a 100 millilitri per singola risposta quando si parla di modelli di grandi dimensioni Sull'acqua vi porto tre casi che secondo me sono significativi perché sconfinano un po' anche sul tema degli impatti sociali connessi a quelli ambientali.

Un impianto di Microsoft a Goodyear in Arizona, zona soggetta a siccità e stress idrico, è stato stimato possa consumare fino a 212 milioni di litri di acqua potabile all'anno che sono l'equivalente del fabbisogno di 670 famiglie locali. A Mesa, Google ha ottenuto un permesso per un data center che può utilizzare fino a 5,5 milioni di metri cubi d'acqua all'anno pari al consumo di 23 mila abitanti. Nella regione dell'Aragona, Spagna, dove il 75% per cento del territorio è a rischio desertificazione, Amazon è stata autorizzata a usare oltre 775 mila metri cubi d'acqua all'anno, una quantità sufficiente a irrigare 233 ettari di mais, che è una delle principali colture locali. A emissioni acqua, che sono probabilmente i due impatti più noti, si aggiungono altri impatti ambientali, in particolare quelli legati alla catena a monte a valle dei data center, la produzione dei componenti, che come sapete comporta l'uso di terre rare e materie prime critiche per l'economia, anche al di là delle ai nonché il loro smaltimento a fine vita, e queste sono altre due tematiche decisamente rilevanti quando allarghiamo lo sguardo alla tecnologia AI nel suo complesso e agli impatti ambientali che questa inevitabilmente provoca.

