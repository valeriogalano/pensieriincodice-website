A questo punto qualcuno potrebbe obiettare sì, ma i modelli diventano continuamente più efficienti e questo è assolutamente vero, ogni nuova generazione di GPU, di algoritmi, di modelli riesce generalmente a far di più consumando meno. E chi si ricorda il concetto di indice emissivo a cui ho accennato nel corso dell'episodio potrebbe obiettare va bene le emissioni assolute aumentano ma magari il fatturato cresce ancora di più e quindi in proporzione l'azienda sta comunque migliorando.

Breve recap per chi non lo ricordasse, l'indice emissivo si calcola prendendo il valore assoluto di emissioni di CO2 e dividendolo per un denominatore che sia significativo per l'azienda. Poi si compare rispetto a un anno base o un periodo temporale anche più esteso e si verifica se aumenta negli anni significa che l'azienda performa peggio, cioè emette di più per singola unità funzionale. Se invece cala negli anni significa che sta efficientando.

Con tutte le limitazioni del caso, trattandosi di aziende tech, quindi non avendo noi un'unità funzionale come, non so, le tonnellate di prodotto, il denominatore più coerente in questo caso è il fatturato. Ed è un bene che non prendiamo un indicatore come il numero di lavoratori medi dell'azienda perché con i licenziamenti dell'ultimo periodo nelle aziende tech il risultato sarebbe ancora peggiore. Ecco, il punto non è solo che Microsoft Google o altre aziende del settore emettono più CO2 in termini assoluti. Il punto è che la crescita dell'infrastruttura dedicata all'AI è stata talmente rapida da rendere difficile migliorare gli indicatori relativi.

Sostanzialmente l'efficienza continua ad aumentare ma la domanda cresce ancora più velocemente. È il cosiddetto paradosso di givons L'efficienza riduce il costo unitario ma fa aumentare così tanto la domanda da far crescere il consumo complessivo.

