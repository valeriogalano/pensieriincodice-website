Ebbene, oggi Paola lo ha fatto egregiamente con un'idea che circola parecchio, cioè che l'impatto ambientale dell'Intelligenza Artificiale si possa riassumere in un numero, e al suo posto ci ha lasciato qualche domanda giusta in più da farci la prossima volta che leggiamo un dato o un'etichetta *green*.

Tutte le fonti citate di questo episodio - e il glossario promesso - le trovi in descrizione. Se invece vuoi discuterne direttamente con Paola, passa dal gruppo Telegram di Pensieri in codice, dato che, come ti ha raccontato all'inizio lei stessa, questo episodio è nato proprio da lì.

E se anche tu hai un argomento che ti appassiona e che pensi possa stare bene su questi microfoni, ricorda che la Community Edition è uno spazio pensato apposta per te.

Non serve essere esperti né avere un'attrezzatura professionale: è quasi come registrare un vocale e, in ogni caso, ci sono io a guidarti passo passo. Se ti va, scrivimi su Telegram o a valerio@pensieriincodice.it - mi raccomando, con due i - e ne parliamo insieme.

Prima di salutarci, ti ricordo che Pensieri in codice è un progetto indipendente e senza pubblicità, che porto avanti nel mio tempo libero e che si basa sulla filosofia del value4value. Se quello che hai ascoltato ti ha dato qualcosa - uno spunto, una riflessione o anche solo un momento di intrattenimento - puoi scegliere di restituire un po' di questo valore.

Puoi farlo con il tuo tempo, condividendo l'episodio con qualcuno a cui pensi possa interessare. Con il tuo talento, come ha fatto oggi Paola, proponendo un episodio per la Community Edition o dando una mano al progetto. Oppure con il tuo tesoro, cioè con un piccolo supporto economico. Trovi tutti i riferimenti su pensieriincodice.it/sostieni.

A questo proposito, un grazie di cuore va sempre a Edoardo, Carlo e Cristian, che continuano a dare il loro supporto ogni mese.

Bene, per oggi direi che è tutto. Ancora un grazie a Paola, un grazie a te che hai ascoltato fino alla fine, e ci risentiamo al prossimo episodio, ma senza mai dimenticare che *un informatico risolve problemi, a volte anche usando il computer*.
